<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Plumbing — Devis &amp; Factures</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
:root{
  --bg:#F8F9FB;--surface:#fff;--border:#E5E7EB;
  --text:#1F2937;--text-2:#6B7280;--text-3:#9CA3AF;
  --ink:#111827;--blue:#2563EB;--blue-lt:#EFF6FF;
  --green:#059669;--green-lt:#ECFDF5;
  --red:#DC2626;--amber:#D97706;--amber-lt:#FFFBEB;
  --radius:8px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);margin:0;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* TOPBAR */
.topbar{background:var(--ink);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:100;}
.topbar h1{font-size:14px;font-weight:600;margin:0;}
.topbar .sep{width:1px;height:20px;background:rgba(255,255,255,.15);}
.topbar .sub{font-size:12px;color:#9CA3AF;font-weight:400;}

/* TABS */
.tabs{display:none;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 48px);}
.col-form{padding:20px;overflow-y:auto;max-height:calc(100vh - 48px);}
.col-preview{background:#E5E7EB;padding:20px;overflow-y:auto;max-height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;}

/* SECTION */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.section-title{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px;border-bottom:1px solid var(--border);background:#FAFBFC;}
.section-body{padding:16px;}

/* FORM */
input,select{font-family:var(--font);font-size:14px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
input[type="number"]{font-family:var(--mono);font-size:13px;}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* META ROW */
.meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;}
.meta-row .field{margin-bottom:0;display:flex;align-items:center;gap:6px;}
.meta-row .field label{margin-bottom:0;white-space:nowrap;}
.meta-row .field input{width:auto;}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;user-select:none;text-transform:uppercase;}
.badge.devis{background:var(--amber-lt);color:var(--amber);border:1px solid #FCD34D;}
.badge.facture{background:var(--green-lt);color:var(--green);border:1px solid #6EE7B7;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);background:#FAFBFC;}
.tbl th.r{text-align:right;}
.tbl td{padding:6px 10px;border-bottom:1px solid #F3F4F6;vertical-align:middle;}
.tbl td.r{text-align:right;}
.tbl td input{border:none;background:transparent;padding:4px 6px;font-size:13px;width:100%;}
.tbl td input:focus{background:var(--blue-lt);border-radius:4px;}
.tbl td.num{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap;}
.tbl .idx{width:30px;text-align:center;color:var(--text-3);font-size:12px;}
.rm-btn{width:24px;height:24px;border:none;background:none;color:var(--text-3);cursor:pointer;border-radius:4px;font-size:16px;display:flex;align-items:center;justify-content:center;}
.rm-btn:hover{background:#FEE2E2;color:var(--red);}
.add-btn{display:inline-block;padding:6px 12px;font-size:12px;font-weight:500;color:var(--blue);cursor:pointer;margin:8px 0 4px 10px;}
.add-btn:hover{text-decoration:underline;}

/* SUMMARY */
.summary{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.sum-line{display:flex;justify-content:space-between;padding:9px 14px;font-size:13px;border-bottom:1px solid #F3F4F6;}
.sum-line:last-child{border-bottom:none;}
.sum-line .lbl{color:var(--text-2);}
.sum-line .val{font-family:var(--mono);font-size:12px;font-weight:600;}
.sum-line.total{background:var(--ink);padding:12px 14px;}
.sum-line.total .lbl,.sum-line.total .val{color:#fff;font-weight:700;font-size:14px;}
.sum-line.fc{background:#F9FAFB;}
.sum-line.fc .val{color:var(--text-2);}
.imp-input{display:flex;align-items:center;gap:6px;}
.imp-input input{width:50px;text-align:center;padding:4px 6px;font-size:12px;}

/* ACTIONS */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;font-size:13px;font-weight:500;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-family:var(--font);background:#fff;color:var(--text);transition:background .15s;}
.btn:hover{background:#F3F4F6;}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-dark:hover{background:#374151;}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover{background:#047857;}
.btn-red{color:var(--red);border-color:#FCA5A5;}
.btn-red:hover{background:#FEF2F2;}

/* PREVIEW */
.preview-label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;width:100%;max-width:700px;}
.doc-frame{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:100%;max-width:700px;overflow:hidden;}

/* ══════ MOBILE ══════ */
@media(max-width:900px){
  .layout{grid-template-columns:1fr;display:flex;flex-direction:column;}
  .col-form,.col-preview{max-height:none;overflow:visible;}
  .col-form{padding:16px;}
  .col-preview{padding:16px;}
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:90;}
  .tabs button{flex:1;padding:10px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;font-family:var(--font);}
  .tabs button.active{color:var(--blue);border-bottom-color:var(--blue);}
  .col-form.hidden,.col-preview.hidden{display:none;}
  .row2{grid-template-columns:1fr;}
  .row3{grid-template-columns:1fr;}
  .meta-row{flex-direction:column;align-items:stretch;gap:8px;}
  .meta-row .field{flex-direction:column;align-items:stretch;}
  .meta-row .field input{width:100%;}
  .doc-frame{border-radius:0;box-shadow:none;border:1px solid var(--border);}
  .tbl th,.tbl td{padding:6px 8px;font-size:12px;}
}
@media(max-width:400px){
  .topbar{padding:0 12px;}
  .col-form,.col-preview{padding:12px;}
  .section-body{padding:12px;}
  .actions{flex-direction:column;}
  .actions .btn{width:100%;justify-content:center;}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>Master Plumbing</h1>
  <div class="sep"></div>
  <span class="sub">Devis &amp; Factures</span>
</div>

<!-- MOBILE TABS -->
<div class="tabs">
  <button class="tab-btn active" data-tab="form">Formulaire</button>
  <button class="tab-btn" data-tab="preview">Apercu</button>
</div>

<div class="layout">

  <!-- LEFT: FORM -->
  <div class="col-form" id="col_form">

    <!-- Meta -->
    <div class="meta-row">
      <div class="field">
        <label>Type</label>
        <span id="type_badge" class="badge devis" onclick="toggleType()">DEVIS</span>
        <input type="hidden" id="type" value="devis">
      </div>
      <div class="field">
        <label>N°</label>
        <input id="number" placeholder="MP-2025-001" style="width:130px;">
      </div>
      <div class="field">
        <label>Date</label>
        <input id="date" type="date" style="width:150px;">
      </div>
      <div class="field">
        <label>1$ =</label>
        <input id="fx_rate" type="number" value="2800" style="width:80px;">
        <span style="font-size:12px;color:var(--text-2);">FC</span>
      </div>
    </div>

    <!-- Client -->
    <div class="section">
      <div class="section-title">Client</div>
      <div class="section-body">
        <div class="field"><label>Nom</label><input id="client_name" placeholder="Nom du client"></div>
        <div class="row2">
          <div class="field"><label>Telephone</label><input id="client_tel" placeholder="+243 …"></div>
          <div class="field"><label>Adresse</label><input id="client_addr" placeholder="Quartier, Ville"></div>
        </div>
      </div>
    </div>

    <!-- Entreprise -->
    <div class="section">
      <div class="section-title">Entreprise</div>
      <div class="section-body">
        <div class="field"><label>Nom</label><input id="mt_name" value="Master Plumbing"></div>
        <div class="row2">
          <div class="field"><label>Gerant</label><input id="mt_owner" value="Enoch"></div>
          <div class="field"><label>Telephone</label><input id="mt_tel" value="+243 999 313 797"></div>
        </div>
        <div class="field"><label>Adresse</label><input id="mt_addr" value="Ville, Republique Dem. du Congo"></div>
      </div>
    </div>

    <!-- Materiels -->
    <div class="section">
      <div class="section-title">Materiels &amp; Fournitures</div>
      <table class="tbl" id="items">
        <thead><tr>
          <th class="idx">#</th>
          <th>Designation</th>
          <th class="r" style="width:55px;">Qte</th>
          <th class="r" style="width:90px;">P.U. (FC)</th>
          <th class="r" style="width:90px;">Total</th>
          <th style="width:30px;"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <span class="add-btn" id="addRow">+ Ajouter</span>
    </div>

    <!-- Main d'oeuvre -->
    <div class="section">
      <div class="section-title">Main-d'oeuvre</div>
      <table class="tbl" id="labor_items">
        <thead><tr>
          <th class="idx">#</th>
          <th>Description</th>
          <th class="r" style="width:100px;">Montant ($)</th>
          <th style="width:30px;"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <span class="add-btn" id="addLaborRow">+ Ajouter</span>
    </div>

    <!-- Summary -->
    <div class="summary">
      <div class="sum-line"><span class="lbl">Sous-total materiels</span><span class="val" id="subtotal">0 FC</span></div>
      <div class="sum-line"><span class="lbl">Sous-total main-d'oeuvre</span><span class="val" id="labor_total">0.00 $</span></div>
      <div class="sum-line">
        <span class="lbl">Imprevus</span>
        <div class="imp-input">
          <input id="imprevu" type="number" value="5" min="0" max="100">
          <span style="font-size:12px;color:var(--text-2);">%</span>
          <span class="val" id="imprevu_amount">0.00 $</span>
        </div>
      </div>
      <div class="sum-line total"><span class="lbl">TOTAL</span><span class="val" id="total">0.00 $</span></div>
      <div class="sum-line fc"><span class="lbl">Equivalent FC</span><span class="val" id="total_fc">0 FC</span></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-green" id="exportPDF">Exporter PDF</button>
      <button class="btn" id="downloadJSON">Sauvegarder</button>
      <button class="btn" id="loadJSON">Charger</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;">
      <button class="btn btn-red" id="resetAll">Effacer</button>
    </div>
  </div>

  <!-- RIGHT: PREVIEW -->
  <div class="col-preview" id="col_preview">
    <div class="preview-label">
      <span>Apercu</span>
      <button class="btn btn-green" onclick="doExport()" style="padding:6px 10px;font-size:11px;">Exporter PDF</button>
    </div>
    <div class="doc-frame" id="doc_preview"></div>
  </div>

</div>

<script>
function fmt(n){return Number(n||0).toLocaleString('fr-FR');}
function fmtU(n){return Number(n||0).toFixed(2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(iso){if(!iso)return'\u2014';const[y,m,d]=iso.split('-');const ms=['janvier','f\u00e9vrier','mars','avril','mai','juin','juillet','ao\u00fbt','septembre','octobre','novembre','d\u00e9cembre'];return`${+d} ${ms[+m-1]} ${y}`;}

// TYPE
function toggleType(){
  const inp=document.getElementById('type'),b=document.getElementById('type_badge');
  if(inp.value==='devis'){inp.value='facture';b.textContent='FACTURE';b.className='badge facture';}
  else{inp.value='devis';b.textContent='DEVIS';b.className='badge devis';}
  render();
}

// MOBILE TABS
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=btn.dataset.tab;
    document.getElementById('col_form').classList.toggle('hidden',t!=='form');
    document.getElementById('col_preview').classList.toggle('hidden',t!=='preview');
  });
});

// TOTALS
function updateTotals(){
  const fx=parseFloat(document.getElementById('fx_rate').value)||1;
  let matFC=0;
  document.querySelectorAll('#items tbody tr').forEach(r=>{
    const qty=parseFloat(r.querySelector('.qty').value)||0;
    const p=parseFloat(r.querySelector('.pu').value)||0;
    const t=qty*p;matFC+=t;
    r.querySelector('.tot').textContent=fmt(t);
  });
  let labUSD=0;
  document.querySelectorAll('#labor_items tbody tr').forEach(r=>{
    labUSD+=parseFloat(r.querySelector('.amt').value)||0;
  });
  const matUSD=matFC/fx;
  const impPct=parseFloat(document.getElementById('imprevu').value)||0;
  const imp=(matUSD+labUSD)*impPct/100;
  const totalUSD=matUSD+labUSD+imp;
  const totalFC=totalUSD*fx;
  document.getElementById('subtotal').textContent=fmt(matFC)+' FC';
  document.getElementById('labor_total').textContent=fmtU(labUSD)+' $';
  document.getElementById('imprevu_amount').textContent=fmtU(imp)+' $';
  document.getElementById('total').textContent=fmtU(totalUSD)+' $';
  document.getElementById('total_fc').textContent=fmt(totalFC)+' FC';
  render();
}

// ADD ROWS
function addMat(desc='',qty=1,price=0){
  const tb=document.querySelector('#items tbody');
  const i=tb.children.length+1;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="idx">${i}</td><td><input class="desc" value="${esc(desc)}" placeholder="Designation"></td><td class="r"><input class="qty" type="number" min="0" value="${qty}" style="width:50px;text-align:right;"></td><td class="r"><input class="pu" type="number" min="0" value="${price}" style="width:80px;text-align:right;"></td><td class="num tot">0</td><td><button class="rm-btn">&times;</button></td>`;
  tb.appendChild(tr);
  tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',updateTotals));
  tr.querySelector('.rm-btn').addEventListener('click',()=>{tr.remove();reindex('items');updateTotals();});
  updateTotals();
}
function addLab(desc='',amt=0){
  const tb=document.querySelector('#labor_items tbody');
  const i=tb.children.length+1;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="idx">${i}</td><td><input class="desc" value="${esc(desc)}" placeholder="Description"></td><td class="r"><input class="amt" type="number" min="0" value="${amt}" style="width:80px;text-align:right;"></td><td><button class="rm-btn">&times;</button></td>`;
  tb.appendChild(tr);
  tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',updateTotals));
  tr.querySelector('.rm-btn').addEventListener('click',()=>{tr.remove();reindex('labor_items');updateTotals();});
  updateTotals();
}
function reindex(id){document.querySelectorAll(`#${id} tbody tr`).forEach((tr,i)=>{tr.querySelector('.idx').textContent=i+1;});}

// COLLECT
function collect(){
  const fx=parseFloat(document.getElementById('fx_rate').value)||1;
  const tp=document.getElementById('type').value;
  const num=document.getElementById('number').value||'MP-0001';
  const dt=document.getElementById('date').value;
  const impPct=parseFloat(document.getElementById('imprevu').value)||0;
  const cl={name:document.getElementById('client_name').value||'\u2014',tel:document.getElementById('client_tel').value,addr:document.getElementById('client_addr').value};
  const co={name:document.getElementById('mt_name').value,owner:document.getElementById('mt_owner').value,tel:document.getElementById('mt_tel').value,addr:document.getElementById('mt_addr').value};
  let mats=[];let matFC=0;
  document.querySelectorAll('#items tbody tr').forEach((r,i)=>{const d=r.querySelector('.desc').value;const q=parseFloat(r.querySelector('.qty').value)||0;const p=parseFloat(r.querySelector('.pu').value)||0;const t=q*p;matFC+=t;mats.push({i:i+1,d,q,p,t});});
  let labs=[];let labUSD=0;
  document.querySelectorAll('#labor_items tbody tr').forEach((r,i)=>{const d=r.querySelector('.desc').value;const a=parseFloat(r.querySelector('.amt').value)||0;labUSD+=a;labs.push({i:i+1,d,a});});
  const matUSD=matFC/fx;const imp=(matUSD+labUSD)*impPct/100;const totalUSD=matUSD+labUSD+imp;const totalFC=totalUSD*fx;
  return{fx,tp,num,dt,impPct,cl,co,mats,labs,matFC,matUSD,labUSD,imp,totalUSD,totalFC};
}

// ─── BUILD DOC HTML ───────────────────────────────
function buildDoc(d){
  const matHtml=d.mats.map(r=>`<tr>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:center;color:#6B7280;font-size:11px;">${r.i}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;font-size:12px;">${esc(r.d)||'\u2014'}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:right;font-size:12px;">${r.q}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:right;font-size:12px;">${fmt(r.p)}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:right;font-size:12px;font-weight:600;">${fmt(r.t)} FC</td>
  </tr>`).join('')||`<tr><td colspan="5" style="padding:14px;text-align:center;color:#9CA3AF;font-size:12px;">Aucun</td></tr>`;

  const labHtml=d.labs.map(r=>`<tr>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:center;color:#6B7280;font-size:11px;">${r.i}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;font-size:12px;">${esc(r.d)||'\u2014'}</td>
    <td style="padding:6px 10px;border-bottom:1px solid #F3F4F6;text-align:right;font-size:12px;font-weight:600;color:#2563EB;">${fmtU(r.a)} $</td>
  </tr>`).join('')||`<tr><td colspan="3" style="padding:14px;text-align:center;color:#9CA3AF;font-size:12px;">Aucun</td></tr>`;

  return`<div style="font-family:'Inter',system-ui,sans-serif;color:#1F2937;line-height:1.5;">
<!-- HEADER -->
<div style="padding:20px 24px;border-bottom:3px solid #111827;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
    <div>
      <div style="font-size:18px;font-weight:700;color:#111827;margin-bottom:2px;">${esc(d.co.name)}</div>
      <div style="font-size:11px;color:#6B7280;line-height:1.6;">G\u00e9rant : ${esc(d.co.owner)} &middot; T\u00e9l : ${esc(d.co.tel)}<br>${esc(d.co.addr)}</div>
    </div>
    <div style="text-align:right;">
      <div style="display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.08em;${d.tp==='facture'?'background:#ECFDF5;color:#059669;border:1px solid #6EE7B7;':'background:#FFFBEB;color:#D97706;border:1px solid #FCD34D;'}">${d.tp.toUpperCase()}</div>
      <div style="font-size:16px;font-weight:700;margin-top:4px;">N\u00b0 ${esc(d.num)}</div>
      <div style="font-size:11px;color:#6B7280;margin-top:2px;">${fmtDate(d.dt)}</div>
      <div style="font-size:10px;color:#9CA3AF;margin-top:2px;">Taux : 1 $ = ${fmt(d.fx)} FC</div>
    </div>
  </div>
</div>

<!-- CLIENT -->
<div style="padding:16px 24px;background:#F9FAFB;border-bottom:1px solid #E5E7EB;">
  <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#9CA3AF;margin-bottom:4px;">Factur\u00e9 \u00e0</div>
  <div style="font-size:14px;font-weight:600;">${esc(d.cl.name)}</div>
  <div style="font-size:11px;color:#6B7280;">${[d.cl.tel,d.cl.addr].filter(Boolean).map(esc).join(' \u00b7 ')||'\u2014'}</div>
</div>

<!-- MATERIELS -->
<div style="padding:16px 24px 0;">
  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#374151;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #E5E7EB;">Mat\u00e9riels &amp; Fournitures</div>
  <table style="width:100%;border-collapse:collapse;">
    <thead><tr style="background:#F9FAFB;">
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:center;width:28px;">#</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:left;">D\u00e9signation</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:right;width:40px;">Qt\u00e9</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:right;width:80px;">P.U. (FC)</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:right;width:90px;">Total</th>
    </tr></thead>
    <tbody>${matHtml}</tbody>
  </table>
</div>

<!-- MAIN D'OEUVRE -->
<div style="padding:16px 24px 0;">
  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#374151;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #E5E7EB;">Main-d'\u0153uvre</div>
  <table style="width:100%;border-collapse:collapse;">
    <thead><tr style="background:#F9FAFB;">
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:center;width:28px;">#</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:left;">Description</th>
      <th style="padding:6px 10px;font-size:10px;font-weight:600;color:#6B7280;text-align:right;width:100px;">Montant</th>
    </tr></thead>
    <tbody>${labHtml}</tbody>
  </table>
</div>

<!-- TOTAL -->
<div style="padding:20px 24px;">
  <div style="margin-left:auto;width:220px;">
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#6B7280;border-bottom:1px solid #F3F4F6;"><span>Mat\u00e9riels</span><span style="font-weight:600;">${fmtU(d.matUSD)} $</span></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#6B7280;border-bottom:1px solid #F3F4F6;"><span>Main-d'\u0153uvre</span><span style="font-weight:600;color:#2563EB;">${fmtU(d.labUSD)} $</span></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#6B7280;border-bottom:1px solid #F3F4F6;"><span>Impr\u00e9vus (${d.impPct}%)</span><span style="font-weight:600;">${fmtU(d.imp)} $</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px;font-weight:700;border-top:2px solid #111827;margin-top:4px;"><span>TOTAL</span><span>${fmtU(d.totalUSD)} $</span></div>
    <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px;color:#6B7280;"><span>Equiv.</span><span>${fmt(d.totalFC)} FC</span></div>
  </div>
</div>

<!-- CONDITIONS -->
<div style="padding:0 24px 16px;">
  ${d.tp==='facture'?`<div style="padding:10px 12px;background:#FFFBEB;border:1px solid #FCD34D;border-radius:6px;font-size:10px;color:#92400E;">
    <strong>Conditions :</strong> Paiement d\u00fb \u00e0 r\u00e9ception. P\u00e9nalit\u00e9s de retard : 1,5% par mois.
  </div>`:`<div style="padding:10px 12px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;font-size:10px;color:#1E40AF;">
    <strong>Validit\u00e9 :</strong> Ce devis est valable 30 jours. Taux indicatif : 1 $ = ${fmt(d.fx)} FC.
  </div>`}
</div>

<!-- SIGNATURES -->
<div style="padding:16px 24px 24px;display:flex;justify-content:space-between;border-top:1px solid #E5E7EB;">
  <div style="text-align:center;width:140px;">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9CA3AF;margin-bottom:4px;">Le Client</div>
    <div style="height:40px;border-bottom:1px solid #D1D5DB;"></div>
  </div>
  <div style="text-align:center;width:140px;">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9CA3AF;margin-bottom:4px;">Signature &amp; Cachet</div>
    <div style="height:40px;border-bottom:1px solid #D1D5DB;"></div>
  </div>
</div>
</div>`;
}

// ─── RENDER LIVE PREVIEW ──────────────────────────
function render(){document.getElementById('doc_preview').innerHTML=buildDoc(collect());}

// ─── EXPORT PDF ───────────────────────────────────
function doExport(){
  const d=collect();
  const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(d.tp==='facture'?'Facture':'Devis')} ${esc(d.num)}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;}body{margin:0;padding:20px;background:#fff;font-family:'Inter',system-ui,sans-serif;}@media print{@page{margin:10mm;}body{padding:0;}}</style>
</head><body><div style="max-width:760px;margin:0 auto;">${buildDoc(d)}</div></body></html>`;
  const w=window.open('','_blank','width=860,height=700');
  if(!w){alert('Autorisez les pop-ups pour exporter.');return;}
  w.document.open();w.document.write(html);w.document.close();w.focus();
  setTimeout(()=>w.print(),600);
}
document.getElementById('exportPDF').addEventListener('click',doExport);

// ─── SAVE / LOAD ──────────────────────────────────
document.getElementById('downloadJSON').addEventListener('click',()=>{
  const data={type:document.getElementById('type').value,number:document.getElementById('number').value,date:document.getElementById('date').value,fx_rate:document.getElementById('fx_rate').value,imprevu:document.getElementById('imprevu').value,
    company:{name:document.getElementById('mt_name').value,owner:document.getElementById('mt_owner').value,tel:document.getElementById('mt_tel').value,addr:document.getElementById('mt_addr').value},
    client:{name:document.getElementById('client_name').value,tel:document.getElementById('client_tel').value,addr:document.getElementById('client_addr').value},
    items:Array.from(document.querySelectorAll('#items tbody tr')).map(tr=>({d:tr.querySelector('.desc').value,q:tr.querySelector('.qty').value,p:tr.querySelector('.pu').value})),
    labor:Array.from(document.querySelectorAll('#labor_items tbody tr')).map(tr=>({d:tr.querySelector('.desc').value,p:tr.querySelector('.amt').value}))};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`MP_${data.type}_${data.number||'doc'}.json`;a.click();
});
document.getElementById('loadJSON').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{loadData(JSON.parse(ev.target.result));}catch{alert('Fichier invalide.');}};r.readAsText(f);e.target.value='';
});
function loadData(d){
  document.querySelector('#items tbody').innerHTML='';
  document.querySelector('#labor_items tbody').innerHTML='';
  if(d.type){document.getElementById('type').value=d.type;const b=document.getElementById('type_badge');b.textContent=d.type.toUpperCase();b.className='badge '+d.type;}
  if(d.number) document.getElementById('number').value=d.number;
  if(d.date) document.getElementById('date').value=d.date;
  if(d.fx_rate) document.getElementById('fx_rate').value=d.fx_rate;
  if(d.imprevu!=null) document.getElementById('imprevu').value=d.imprevu;
  if(d.vat!=null&&d.imprevu==null) document.getElementById('imprevu').value=d.vat;
  if(d.company){document.getElementById('mt_name').value=d.company.name||'';document.getElementById('mt_owner').value=d.company.owner||'';document.getElementById('mt_tel').value=d.company.tel||'';document.getElementById('mt_addr').value=d.company.addr||'';}
  if(d.client){document.getElementById('client_name').value=d.client.name||'';document.getElementById('client_tel').value=d.client.tel||'';document.getElementById('client_addr').value=d.client.addr||'';}
  (d.items||[]).forEach(it=>addMat(it.d,it.q,it.p));
  (d.labor||[]).forEach(it=>addLab(it.d,it.p));
}

// ─── RESET ────────────────────────────────────────
document.getElementById('resetAll').addEventListener('click',()=>{
  if(!confirm('Tout effacer ?'))return;
  document.querySelector('#items tbody').innerHTML='';
  document.querySelector('#labor_items tbody').innerHTML='';
  ['client_name','client_tel','client_addr'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('number').value='';
  init();
});

// ─── INIT ─────────────────────────────────────────
function init(){
  document.getElementById('date').valueAsDate=new Date();
  if(!document.getElementById('number').value) document.getElementById('number').value='MP-'+new Date().getFullYear()+'-001';
  addMat('Tuyau PVC 1/2"',2,4500);
  addLab('Installation tuyauterie',50);
}
document.getElementById('addRow').addEventListener('click',()=>addMat());
document.getElementById('addLaborRow').addEventListener('click',()=>addLab());
document.getElementById('imprevu').addEventListener('input',updateTotals);
document.getElementById('fx_rate').addEventListener('input',updateTotals);
['number','date','client_name','client_tel','client_addr','mt_name','mt_owner','mt_tel','mt_addr'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
});
init();
</script>
</body>
</html>
